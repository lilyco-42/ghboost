name: Build All Platforms

# 跨平台 ghboost 构建:
#   Android(arm64/armv7/x86_64, 含 APK) · Windows(x64/arm64) · Linux(x64/arm64, gnu+musl)
#   macOS(aarch64/x86_64) · iOS(device+sim) · Web(WASM)
#
# 参考: lilyco-42/cute-pet build-all.yml
# 备注:
#   - Android APK 需要 ghboost-android/ 目录下的 Gradle 项目
#   - iOS 需要 Apple Developer 签名
#   - 打 v* tag 时自动发布 GitHub Release

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ============ 测试 ============
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt -- --check
      - name: Clippy (default features)
        run: cargo clippy --all-targets -- -D warnings
      # webview 已从发布构建中移除（默认构建双击即开浏览器控制台，不再依赖本机
      # WebView2/WebKit）。这里只做一次 check 防止这条可选路径悄悄腐烂。
      # 注意是 check 不是 build：check 不链接，所以不需要装 webkit2gtk。
      - name: Check (optional webview feature)
        run: cargo check --all-targets --features webview
      - name: Run tests
        run: cargo test

  # ============ Android (.so 交叉编译) ============
  android:
    name: Android (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
            cc: aarch64-linux-android36-clang
          - abi: armeabi-v7a
            target: armv7-linux-androideabi
            cc: armv7a-linux-androideabi36-clang
          - abi: x86_64
            target: x86_64-linux-android
            cc: x86_64-linux-android36-clang
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-android-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-android-
            cargo-${{ runner.os }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Android SDK + NDK
        uses: android-actions/setup-android@v3
      - name: Install NDK
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;27.0.12077973" \
            --sdk_root=$ANDROID_HOME
      # 必须显式安装：cargo-ndk 不是 rustup/cargo 自带命令。
      # 缺这一步会直接 `error: no such command: ndk`（exit code 101）。
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build .so
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: |
          # 注意：ghboost-ffi 有自己的 Cargo.lock，**不是**根 workspace 的成员，
          # 所以在仓库根目录用 `-p ghboost-ffi` 会让 cargo-ndk 直接 panic
          # "unknown package: ghboost-ffi"。必须用 --manifest-path 指进去。
          cargo ndk --platform 24 -t ${{ matrix.abi }} build --release \
            --manifest-path ghboost-ffi/Cargo.toml
      - name: Verify JNI symbols
        run: |
          # 用 --manifest-path 构建时，产物落在 ghboost-ffi/target 下
          SO="ghboost-ffi/target/aarch64-linux-android/release/libghboost_ffi.so"
          if [ -f "$SO" ]; then
            echo "✅ .so built: $(ls -lh "$SO" | awk '{print $5}')"
            nm -D "$SO" | grep "Java_com_ghboost" | head -5
          else
            echo "⚠️  .so not found, trying alternate path"
            find . -name "libghboost_ffi.so" -type f 2>/dev/null
          fi
      - name: Stage artifact
        run: |
          set -e
          mkdir -p dist
          SO=$(find . -path "*/release/libghboost_ffi.so" -type f | head -1)
          if [ -n "$SO" ]; then
            cp "$SO" "dist/libghboost_ffi-${{ matrix.abi }}.so"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.abi }}
          path: dist/
          if-no-files-found: warn

  # ============ Android APK ============
  android-apk:
    name: Android APK
    needs: [android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Download all Android .so artifacts
        uses: actions/download-artifact@v4
        with:
          path: so-artifacts
          pattern: android-*
          merge-multiple: false
      - name: Prepare jniLibs
        run: |
          set -e
          DEST="ghboost-android/app/src/main/jniLibs"
          mkdir -p "$DEST/arm64-v8a" "$DEST/armeabi-v7a" "$DEST/x86_64"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            SO="so-artifacts/android-${abi}/libghboost_ffi-${abi}.so"
            if [ -f "$SO" ]; then
              cp "$SO" "$DEST/${abi}/libghboost_ffi.so"
              echo "✅ $abi: $(ls -lh "$SO" | awk '{print $5}')"
            else
              echo "⚠️  $abi .so not found, APK will be incomplete"
            fi
          done
      - name: Build APK (Gradle)
        working-directory: ghboost-android
        run: |
          chmod +x gradlew 2>/dev/null || true
          ./gradlew assembleRelease --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ghboost-android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

  # ============ Windows ============
  windows:
    name: Windows (${{ matrix.target }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 两个目标都不再带 --features webview。
          # 原因：webview 版运行时要求本机装了 WebView2（Windows 10/11 多数有，
          # 但 LTSC / Server Core / 精简版系统没有），没装时双击 exe 就是"什么都没发生"，
          # 没有任何报错——用户无法自查。
          # 而**默认构建**双击 exe 会起本地 Web 控制台并自动打开浏览器
          # （见 src/web.rs），在任何一个有浏览器的系统上都能用，也不需要随包带
          # webview.dll。故 webview 降级为纯可选（`--features webview`），不做发布构建。
          - target: x86_64-pc-windows-msvc
          - target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}
      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: target
          key: target-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            target-${{ runner.os }}-${{ matrix.target }}
            target-${{ runner.os }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Stage artifact
        shell: bash
        run: |
          set -e
          mkdir -p dist
          TRIPLE="${{ matrix.target }}"
          cp "target/${TRIPLE}/release/ghboost.exe" "dist/ghboost-${TRIPLE}.exe"
          if [ -f "target/${TRIPLE}/release/ghboost.dll" ]; then
            cp "target/${TRIPLE}/release/ghboost.dll" "dist/ghboost-${TRIPLE}.dll"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ghboost-${{ matrix.target }}
          path: dist/
          if-no-files-found: warn

  # ============ Windows MSI Installer ============
  windows-msi:
    name: Windows MSI
    runs-on: windows-latest
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: 版本与 tag 一致性告警
        # MSI 的檔名、以及「新增移除程式」裡顯示的版本號，全部取自 Cargo.toml，
        # 與 git tag 沒有任何自動關聯。忘了 bump 就會出現
        # 「v0.3.4 的 Release 裡掛著 lilyco-ghboost-0.2.0-x86_64.msi」這種事
        # （真實發生過），簽名之後連簽章資訊裡都寫著錯版本。
        # 這裡**只告警不失敗**：寧可發一個版本號難看的包，
        # 也不要因為一條 lint 把整條發布流水線卡住。
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        continue-on-error: true
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CV=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "tag=$TAG cargo=$CV"
          if [ "$TAG" != "$CV" ]; then
            echo "::warning::Cargo.toml 版本 ($CV) 與 tag ($TAG) 不一致：MSI 會帶著 $CV 發出去。發版前請先 bump Cargo.toml 與 ghboost-tray/Cargo.toml，並同步兩個 Cargo.lock（CI 用 --locked，不同步會直接失敗）。"
          fi
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-msi-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}
      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: target
          key: target-${{ runner.os }}-msi-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            target-${{ runner.os }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install cargo-wix
        run: cargo install cargo-wix --locked
      - name: Build MSI
        # --nocapture：不加的话 candle 的真实报错会被 cargo-wix 吞掉，
        # 只剩一句 "The 'candle' application failed with exit code = 10"，无法排障。
        #
        # **构建前必须清掉 target/wix 里的旧 MSI**。target 目录是跨 run 缓存的，
        # 缓存会把上一次的 `lilyco-ghboost-<旧版本>-x86_64.msi` 一并带回来；
        # 而下面 Stage 只要找得到第一个就拷走，字母序 `0.2.0` < `0.3.5`，
        # 于是 v0.3.5 的 Release 里挂的还是 0.2.0 的安装包（真事，已发生一次：
        # 日志里 cargo-wix 明明写着 ICE61 (0.3.5 0.3.5)，挂出去的却是 0.2.0）。
        run: |
          rm -f target/wix/*.msi
          cargo wix --target x86_64-pc-windows-msvc -v --nocapture
        shell: bash
      - name: Stage artifact
        shell: bash
        run: |
          set -e
          mkdir -p dist
          # 正常情况清理后只应剩一个；真多出来时以 mtime 为准，
          # 不再用 find|head -1 那种依赖字母序、会把旧包顶上来的写法。
          ls -l target/wix/*.msi 2>/dev/null || echo "(target/wix 下没有 msi)"
          MSI=$(ls -t target/wix/*.msi 2>/dev/null | head -1)
          if [ -n "$MSI" ]; then
            cp "$MSI" dist/
            echo "MSI: $(basename "$MSI") $(ls -lh "$MSI" | awk '{print $5}')"
          else
            echo "MSI not found"
          fi
      # ── 代码签名（SignPath Foundation，开源免费 OV 证书）──
      # MSI 安装器的 SmartScreen 比 exe 更严格，必须签。守卫式：没配
      # SIGNPATH_API_TOKEN 时跳过；失败只告警、不阻断发版（continue-on-error）。
      # 审批通过后把 CI token 存为仓库 Secret「SIGNPATH_API_TOKEN」即自动签。
      # 注：MSI 可能需要与 exe 不同的 signing policy（installer-signing），
      #     以 SignPath 审批后给的集成指引为准；失败保留未签名 MSI（continue-on-error）。
      - name: Code-sign MSI with SignPath (after approval)
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        shell: pwsh
        continue-on-error: true
        env:
          SIGNPATH_ORG: ${{ vars.SIGNPATH_ORG || 'lilyco-42' }}
          SIGNPATH_PROJECT: ${{ vars.SIGNPATH_PROJECT || 'ghboost-tray' }}
        run: |
          $ErrorActionPreference = "Stop"
          $token = $env:SIGNPATH_API_TOKEN
          $org   = $env:SIGNPATH_ORG
          $proj  = $env:SIGNPATH_PROJECT
          $base  = "https://app.signpath.io/API/v1/$org/projects/$proj"
          $hdr   = @{ Authorization = "Bearer $token" }
          $msi   = Get-ChildItem dist -Filter *.msi -File | Select-Object -First 1
          if (-not $msi) { Write-Host "no MSI found, skip"; exit 0 }
          Write-Host "uploading for signing: $($msi.FullName)"
          $sr = Invoke-RestMethod -Method Post `
            -Uri "$base/artifacts?signingPolicy=release-signing" `
            -Headers $hdr -InFile $msi.FullName -ContentType 'application/octet-stream'
          $srId = $sr.signingRequestId
          $st = $null
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 10
            $st = Invoke-RestMethod -Uri "$base/signing-requests/$srId" -Headers $hdr
            if ($st.status -ne 'Pending' -and $st.status -ne 'Queued') { break }
          }
          if ($st.status -ne 'Completed') { throw "signing not completed: $($st.status)" }
          Invoke-WebRequest -Uri $st.links.signedArtifact -Headers $hdr -OutFile $msi.FullName
          Write-Host "signed: $($msi.FullName)"
      - uses: actions/upload-artifact@v4
        with:
          name: ghboost-windows-msi
          path: dist/
          if-no-files-found: warn

  # ============ Linux ============
  linux:
    name: Linux (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            native: true
          - target: x86_64-unknown-linux-musl
            native: false
          - target: aarch64-unknown-linux-gnu
            native: false
          - target: aarch64-unknown-linux-musl
            native: false
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}
      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: target
          key: target-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            target-${{ runner.os }}-${{ matrix.target }}
            target-${{ runner.os }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # 不再装 libwebkit2gtk-4.1-dev：webview 是可选 feature 且发布构建不带它，
      # 默认构建不链接 webkit/gtk，装了纯属浪费 CI 时间。
      - name: Install zig (for cross-compile)
        run: |
          set -e
          ZIG_VER=0.13.0
          for URL in \
            "https://ziglang.org/download/${ZIG_VER}/zig-linux-x86_64-${ZIG_VER}.tar.xz" \
            "https://github.com/ziglang/zig/releases/download/${ZIG_VER}/zig-linux-x86_64-${ZIG_VER}.tar.xz" ; do
            if curl -fsSL "$URL" -o zig.tar.xz; then break; fi
          done
          tar -xf zig.tar.xz
          echo "$PWD/zig-linux-x86_64-${ZIG_VER}" >> "$GITHUB_PATH"
      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked
      - name: Build
        run: cargo zigbuild --release --target ${{ matrix.target }} ${{ !matrix.native && '--no-default-features' || '' }}
      - name: Stage artifact
        run: |
          set -e
          mkdir -p dist
          TRIPLE="${{ matrix.target }}"
          cp "target/${TRIPLE}/release/ghboost" "dist/ghboost-${TRIPLE}"
          if [ -f "target/${TRIPLE}/release/libghboost.so" ]; then
            cp "target/${TRIPLE}/release/libghboost.so" "dist/libghboost-${TRIPLE}.so"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.target }}
          path: dist/
          if-no-files-found: warn

  # ============ macOS ============
  macos:
    name: macOS (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}
      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: target
          key: target-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            target-${{ runner.os }}-${{ matrix.target }}
            target-${{ runner.os }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Stage artifact
        run: |
          set -e
          mkdir -p dist
          TRIPLE="${{ matrix.target }}"
          cp "target/${TRIPLE}/release/ghboost" "dist/ghboost-${TRIPLE}"
          if [ -f "target/${TRIPLE}/release/libghboost.dylib" ]; then
            cp "target/${TRIPLE}/release/libghboost.dylib" "dist/libghboost-${TRIPLE}.dylib"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}
          path: dist/
          if-no-files-found: warn

  # ============ iOS (静态库 for xcframework) ============
  ios:
    name: iOS (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-ios, aarch64-apple-ios-sim]
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}
      - name: Cache cargo target
        uses: actions/cache@v4
        with:
          path: target
          key: target-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            target-${{ runner.os }}-${{ matrix.target }}
            target-${{ runner.os }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build static lib
        run: cargo build --release --target ${{ matrix.target }}
      - name: Stage artifact
        run: |
          set -e
          mkdir -p dist
          TRIPLE="${{ matrix.target }}"
          # Try the cdylib first, then staticlib
          LIB="target/${TRIPLE}/release/libghboost.dylib"
          if [ ! -f "$LIB" ]; then
            LIB="target/${TRIPLE}/release/libghboost.a"
          fi
          if [ -f "$LIB" ]; then
            cp "$LIB" dist/
            echo "Built: $(ls -lh "$LIB" | awk '{print $5}')"
          else
            echo "Static lib not found"
            find target -name "libghboost*" -type f 2>/dev/null
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ios-${{ matrix.target }}
          path: dist/
          if-no-files-found: warn

  # ============ Web (WASM) ============
  # 曾经是红的（tokio→mio 不支持 wasm32-unknown-unknown），现在通过三处裁剪修好了：
  #   1. wasm 侧 lilyco 关默认 feature（去掉 web → lilyco-gui → axum → hyper → mio）
  #   2. tokio 换成 tokio_with_wasm 的 alias（tokio 在 wasm 上禁掉 rt-multi-thread）
  #   3. getrandom 开 js feature
  # 以及：deploy / mihomo / proxy 三个模块在 wasm 上整模块裁掉（要 spawn 进程、
  # 读写文件、改系统代理，浏览器沙箱里都做不到），因此这里**只编 lib 不编 bin**。
  #
  # ⚠️ 能力边界：产物能被 JS 加载，但 ghboost 的核心功能（拉起 mihomo、改系统
  # 代理、ssh 部署）在浏览器里一律不可用，相关接口返回明确错误。真正可用的只有
  # 纯计算 + 走 Fetch 的部分。想做完整的 Web 端，正确形态是 lilyco-gui 那种
  # axum 服务端 + 浏览器调用，而不是把 CLI 编成 wasm。
  web:
    name: Web (WASM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-wasm-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build WASM
        # --lib：bin 依赖被裁掉的 deploy/mihomo/proxy 模块，编不了也没意义
        # （wasm32-unknown-unknown 的 bin 没有可用的入口，产物是个空壳）。
        run: cargo build --lib --target wasm32-unknown-unknown --release --no-default-features
      - name: Stage artifact
        run: |
          set -e
          mkdir -p dist
          cp target/wasm32-unknown-unknown/release/ghboost.wasm dist/ghboost-wasm.wasm
          ls -lh dist/
      - uses: actions/upload-artifact@v4
        with:
          name: web-wasm
          path: dist/
          if-no-files-found: warn

  # ============ 发布 ============
  release:
    name: Publish GitHub Release
    needs: [windows, windows-msi]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Show artifacts
        run: find dist -type f | sort
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
          body: |
            ## 支持的平台
            - **Android**: arm64-v8a / armeabi-v7a / x86_64 (APK + .so)
            - **Windows**: x86_64 / arm64 + MSI 安装器（含桌面图标）
            - **Linux**: x86_64 / aarch64 (gnu + musl)
            - **macOS**: arm64 / x86_64
            - **iOS**: device / simulator (.a 静态库)
            - **Web**: WASM
