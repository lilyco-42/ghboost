# Windows 桌面托盘端（ghboost-tray）的构建与打包。
#
# 为什么单独一个文件：
#   这个 crate 只在 Windows 上编（tray-icon 在 Linux 要 gtk、macOS 要 objc），
#   放进 build-all.yml 会污染那份已经全绿的矩阵。仓库根 Cargo.toml 没有
#   [workspace] 段，所以它本来也不参与根构建 —— 这里只是把显式编它的动作
#   隔离出来，任何失败都不会波及主 CI。
#
# 为什么必须自动化：
#   代码签名走 SignPath Foundation（给开源项目的免费 OV 级证书），它的硬性
#   前提就是「构建过程全自动化、产物可追溯到仓库源码」，人工在本地编完再上传
#   的不给签。所以这份 workflow 不是锦上添花，是拿到签名的前置条件。
name: tray

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: ghboost-tray (windows-latest)
    runs-on: windows-latest
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # rustfmt + clippy 的 components 和 toolchain 都钉死，理由与 build-all.yml:32
      # 完全一致：某天 GitHub 一升级 toolchain，`cargo fmt -- --check` 就会毫无征兆地
      # 飘红（v0.2.1 时踩过一次）。这里顺带把「闸验的编译器」和「出包的编译器」
      # 统一成同一个 —— 两者不一致时，闸绿着而产物炸（或反过来）都很难归因。
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          toolchain: 1.98.1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ghboost-tray

      - name: Format check (ghboost-tray)
        working-directory: ghboost-tray
        run: cargo fmt -- --check

      # 以前这个 crate 只有 build、没有 fmt 也没有 clippy，等于「改 ghboost-tray
      # 只有编译器兜底」。它是要发给用户双击运行、还要走 SignPath 签名的那份二进制，
      # 闸不能比别处松。两条命令与根 crate 的闸逐字一致。
      - name: Clippy (ghboost-tray)
        working-directory: ghboost-tray
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build
        working-directory: ghboost-tray
        run: cargo build --release --locked

      # 内核随包分发，装完即可用。
      # 理由不是"方便"，而是"否则这个功能是坏的"：我们的目标用户恰恰是
      # GitHub 访问不畅的人，让他们装完再去 GitHub 下载内核是自相矛盾。
      # mihomo 是 GPL-3.0，随二进制一起带上它的许可证文本。
      - name: Stage mihomo kernel
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $ProgressPreference = "SilentlyContinue"
          $K = "dist/kernel"
          New-Item -ItemType Directory -Force -Path "$K/bin" | Out-Null
          New-Item -ItemType Directory -Force -Path "$K/mihomo" | Out-Null
          $Zip = Join-Path $env:TEMP "mihomo.zip"
          Invoke-WebRequest -Uri "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.30/mihomo-windows-amd64-compatible-v1.19.30.zip" -OutFile $Zip -UseBasicParsing
          Expand-Archive -Path $Zip -DestinationPath "$K/bin" -Force
          Remove-Item $Zip -Force
          # Upstream names it mihomo-windows-amd64-compatible.exe; every code path
          # (web.rs::kernel_path) looks for exactly mihomo.exe. Without this rename
          # a fresh install ships a kernel the app can never find.
          $KernelExe = Get-ChildItem "$K/bin" -Filter "mihomo*.exe" -File | Select-Object -First 1
          if ($KernelExe.Name -ne "mihomo.exe") {
            Move-Item $KernelExe.FullName "$K/bin/mihomo.exe" -Force
          }
          if (-not (Test-Path "$K/bin/mihomo.exe")) { throw "staged kernel is not mihomo.exe" }
          foreach ($f in @("country.mmdb", "geosite.dat")) {
            Invoke-WebRequest -Uri "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/$f" -OutFile "$K/mihomo/$f" -UseBasicParsing
          }
          # mihomo 的 GPL-3.0 正文在下面「Stage kernel license texts」那一步统一取，
          # 和另外两个内核放一起 —— 否则这个 helper 会被定义在别的 step 里，而每个
          # `run:` 是独立进程，跨 step 根本调不到。
          Get-ChildItem $K -Recurse -File | Select-Object FullName, Length | Format-Table

      # W7：xray + sing-box 随包，与 mihomo 同址 kernel/bin ——
      # coreman::locate 的既有顺序（随包 bin → 档名正规化 → PATH）直接吃到，
      # 不需要任何新路径逻辑。版本钉死（同 mihomo 做法）：可追溯到确定上游，
      # 也不受「latest 改资产名」影响；资产名是实测 GitHub API 确认过的
      # （Xray 是 Xray-windows-64.zip，不是想当然的 Xray-win64.zip）。
      - name: Stage xray + sing-box kernels
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $ProgressPreference = "SilentlyContinue"
          $K = "dist/kernel"
          New-Item -ItemType Directory -Force -Path "$K/bin" | Out-Null
          $XrayVer = "26.3.27"
          $SingVer = "1.14.2"

          # ── Xray-core（MPL-2.0）── zip 内 exe 档名不一定规范，统一收成 xray.exe
          $Zip = Join-Path $env:TEMP "xray.zip"
          Invoke-WebRequest -Uri "https://github.com/XTLS/Xray-core/releases/download/v$XrayVer/Xray-windows-64.zip" -OutFile $Zip -UseBasicParsing
          $XDir = Join-Path $env:TEMP "xray-ex"
          Remove-Item $XDir -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -Path $Zip -DestinationPath $XDir -Force
          Remove-Item $Zip -Force
          $Exe = Get-ChildItem $XDir -Filter "*.exe" -File | Select-Object -First 1
          if (-not $Exe) { throw "Xray zip contains no exe" }
          Move-Item $Exe.FullName "$K/bin/xray.exe" -Force
          Remove-Item $XDir -Recurse -Force

          # xray 的 geo 数据放 exe 旁（装完在 <InstallDir>\bin）。emit_xray 目前
          # 零 geo 规则（字面 CIDR），这两份是给将来启用 geosite 规则备的；
          # 与 mihomo 的 country.mmdb/geosite.dat（在 mihomo/ 目录）互不相干。
          foreach ($f in @("geoip.dat", "geosite.dat")) {
            Invoke-WebRequest -Uri "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/$f" -OutFile "$K/bin/$f" -UseBasicParsing
          }
          # Xray-core 的 MPL-2.0 正文同样在下面那一步统一取。

          # ── sing-box（GPL-3.0）── 资产名带版本号，靠钉死的版本拼 URL ──
          # zip 内是顶层目录（sing-box-<ver>-windows-amd64/），必须 -Recurse 找；
          # 1.14 起发行包还带 libcronet.dll（Chromium 网络栈），跟内核同目录带上。
          $Zip = Join-Path $env:TEMP "singbox.zip"
          Invoke-WebRequest -Uri "https://github.com/SagerNet/sing-box/releases/download/v$SingVer/sing-box-$SingVer-windows-amd64.zip" -OutFile $Zip -UseBasicParsing
          $SDir = Join-Path $env:TEMP "singbox-ex"
          Remove-Item $SDir -Recurse -Force -ErrorAction SilentlyContinue
          Expand-Archive -Path $Zip -DestinationPath $SDir -Force
          Remove-Item $Zip -Force
          $Exe = Get-ChildItem $SDir -Recurse -Filter "*.exe" -File | Select-Object -First 1
          if (-not $Exe) { throw "sing-box zip contains no exe" }
          Move-Item $Exe.FullName "$K/bin/sing-box.exe" -Force
          $Cronet = Get-ChildItem $SDir -Recurse -Filter "libcronet.dll" -File | Select-Object -First 1
          if ($Cronet) {
            Move-Item $Cronet.FullName "$K/bin/libcronet.dll" -Force
          } else {
            Write-Host "WARN: libcronet.dll absent in sing-box zip (upstream may have dropped it)"
          }
          Remove-Item $SDir -Recurse -Force
          # sing-box 的 GPL-3.0 正文同样在下面那一步统一取。

          # 钉死的版本若被上游撤档/改名，这里当场炸 —— 不带着残缺包往下走。
          foreach ($f in @("xray.exe", "sing-box.exe", "geoip.dat", "geosite.dat")) {
            $p = Join-Path "$K/bin" $f
            if (-not (Test-Path $p)) { throw "staged file missing: $p" }
            if ((Get-Item $p).Length -lt 100KB) { throw "$p implausibly small" }
          }
          Get-ChildItem $K -Recurse -File | Select-Object FullName, Length | Format-Table

      # 三个内核的许可证正文统一在这一步取，不散在各内核的 staging 步里 ——
      # 每个 `run:` 是独立进程，跨 step 调不到函数；而把三份放一起也顺带让
      # 「取不到就炸」这条规则只写一遍。
      #
      # 这三处以前全是 try/catch + "WARN (non-fatal)"。sing-box 那处的 URL
      # （`.../sing-box/main/LICENSE`）**已经 404**（上游挪了文件），于是**每一次**
      # 构建都静默少一份 GPL-3.0 文本：v0.3.16 / v0.3.17 的 zip 里都没有
      # kernel/sing-box-LICENSE.txt，而 THIRD-PARTY-NOTICES.md 承诺它在安装目录里，
      # 81 MB 的 GPL 内核就这么裸发出去。承诺与产物对不上，没有任何东西会发现。
      #
      # 三个来源轮着试，任一拿到**足够大的**正文就算过（大小是硬判据，不是
      # 「HTTP 200 就算」），全挂了才炸。不能只留 gnu.org：2026-09-28 实测
      # GitHub runner 连 www.gnu.org 直接超时，当场把构建炸了。GitHub raw 走自家
      # CDN 稳得多；对 mihomo 而言取到的又正好是**它自己仓库的** LICENSE ——
      # 与 gnu.org 那份逐字节相同（SHA256 3972DC97…），语义最贴。
      #
      # 注意 sing-box 那一行**不能**改成钉版本 tag：v1.14.2 的 LICENSE 只有 791
      # 字节，是「本程序按 GPL-3.0 授权，详见…」的**版权声明**，不含正文，而
      # notices 承诺的是「全文」。SPDX 镜像优先（比「拿 mihomo 的仓库当 sing-box
      # 的许可证来源」语义干净），后两者内容一致。
      - name: Stage kernel license texts (GPL-3.0 x2, MPL-2.0)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $ProgressPreference = "SilentlyContinue"
          $K = "dist/kernel"
          # 自建目录，不依赖前面哪个 step 顺手建过 —— 那个隐式耦合实测会炸成
          # "Could not find a part of the path ...\dist\kernel\mihomo-LICENSE.txt"，
          # 报错完全指不到真正的原因（目录缺失根本不是这一步的责任）。
          New-Item -ItemType Directory -Force -Path $K | Out-Null

          function Get-LicenseText {
            param([string]$OutFile, [string[]]$Urls)
            foreach ($u in $Urls) {
              try {
                Invoke-WebRequest -Uri $u -OutFile $OutFile -UseBasicParsing -TimeoutSec 60
                $sz = (Get-Item $OutFile).Length
                if ($sz -ge 10240) { Write-Host "  ok $OutFile ($sz bytes) <- $u"; return }
                Write-Host "  $u -> only $sz bytes (pointer notice?), trying next"
              } catch {
                Write-Host "  fetch failed: $u -- $($_.Exception.Message)"
              }
            }
            throw "no source yielded real license text for $OutFile"
          }

          Get-LicenseText "$K/mihomo-LICENSE.txt" @(
            "https://raw.githubusercontent.com/MetaCubeX/mihomo/Alpha/LICENSE",
            "https://raw.githubusercontent.com/spdx/license-list-data/main/text/GPL-3.0-only.txt",
            "https://www.gnu.org/licenses/gpl-3.0.txt")
          Get-LicenseText "$K/xray-LICENSE.txt" @(
            "https://raw.githubusercontent.com/XTLS/Xray-core/main/LICENSE",
            "https://raw.githubusercontent.com/spdx/license-list-data/main/text/MPL-2.0.txt")
          Get-LicenseText "$K/sing-box-LICENSE.txt" @(
            "https://raw.githubusercontent.com/spdx/license-list-data/main/text/GPL-3.0-only.txt",
            "https://www.gnu.org/licenses/gpl-3.0.txt",
            "https://raw.githubusercontent.com/MetaCubeX/mihomo/Alpha/LICENSE")

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $Exe = "ghboost-tray/target/release/ghboost-tray.exe"
          if (-not (Test-Path $Exe)) { throw "build output missing: $Exe" }
          Copy-Item $Exe dist/
          Copy-Item ghboost-tray/tools/install.ps1 dist/
          Copy-Item ghboost-tray/tools/uninstall.ps1 dist/
          Copy-Item ghboost-tray/tools/install.bat dist/
          Copy-Item ghboost-tray/tools/uninstall.bat dist/
          Copy-Item ghboost-tray/README.md dist/
          Copy-Item ghboost-tray/THIRD-PARTY-NOTICES.md dist/
          # THIRD-PARTY-NOTICES.md 承诺了哪些 LICENSE 文件，一个都不许缺 ——
          # 承诺必须和产物对得上。v0.3.16 / v0.3.17 的 zip 就少了一份
          # sing-box-LICENSE.txt，而 notices 里明明写着它在安装目录中，没人发现。
          # 从 notices 里正则抓文件名而不是写死列表：以后往包里加内核，只要 notices
          # 写了，它的许可证文本就被自动要求，不用记得同步改这里。
          $Notices = Get-Content "dist/THIRD-PARTY-NOTICES.md" -Raw
          $Promised = [regex]::Matches($Notices, 'kernel[/\\]([A-Za-z0-9._-]*-LICENSE\.txt)') |
                       ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique
          if (-not $Promised) { throw "no kernel license filenames parsed from THIRD-PARTY-NOTICES.md (regex too brittle?)" }
          foreach ($f in $Promised) {
            $p = "dist/kernel/$f"
            if (-not (Test-Path $p)) { throw "THIRD-PARTY-NOTICES.md promises $f but the package does not contain it" }
            $sz = (Get-Item $p).Length
            # 10 KB 下限：足以把「只有一句『详见 GPL-3.0』的版权声明」（sing-box 那个
            # 791 字节的 LICENSE）挡在外面，同时放行 GPL-3.0 全文（~35 KB）和
            # MPL-2.0 全文（~16.7 KB）。
            if ($sz -lt 10240) { throw "$f is only $sz bytes - that is a pointer notice, not the license text" }
            Write-Host "ok $f ($sz bytes)"
          }
          # 校验和覆盖包内所有文件（含内核），方便用户验签
          $Root = (Resolve-Path dist).Path
          (Get-ChildItem dist -Recurse -File | ForEach-Object {
            $rel = $_.FullName.Substring($Root.Length + 1)
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash, $rel
          }) | Out-File -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt
          Compress-Archive -Path dist/* -DestinationPath ghboost-tray-windows-x64.zip

      # ── 代码签名（SignPath Foundation，开源免费 OV 证书）──
      # 前置：你已在 https://signpath.org/apply.html 提交并通过审批，
      #       并把 CI token 存为仓库 Secret「SIGNPATH_API_TOKEN」。
      # 没有该 Secret 时此步骤自动跳过，行为与之前完全一致（产物未签名）。
      # 签名失败时只告警、不阻断发版（continue-on-error）：
      #   脚本在「重新打包」之前若抛错就直接退出，原始未签名 zip 原样保留，
      #   所以配置差错最多让你拿到未签名包，绝不会把 Release 卡死。
      # 审批通过后 SignPath 会给你确切的 API 路径 / 字段名，若与下方不一致请按他们给的改。
      - name: Code-sign with SignPath (after approval)
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        shell: pwsh
        continue-on-error: true
        env:
          SIGNPATH_ORG: ${{ vars.SIGNPATH_ORG || 'lilyco-42' }}
          SIGNPATH_PROJECT: ${{ vars.SIGNPATH_PROJECT || 'ghboost-tray' }}
        run: |
          $ErrorActionPreference = "Stop"
          $token = $env:SIGNPATH_API_TOKEN
          $org   = $env:SIGNPATH_ORG
          $proj  = $env:SIGNPATH_PROJECT
          $base  = "https://app.signpath.io/API/v1/$org/projects/$proj"
          $hdr   = @{ Authorization = "Bearer $token" }

          function Invoke-Sign($file) {
            if (-not (Test-Path $file)) { Write-Host "skip (not found): $file"; return }
            Write-Host "uploading for signing: $file"
            # 1) 上传待签文件，拿 signing-request id
            $sr = Invoke-RestMethod -Method Post `
              -Uri "$base/artifacts?signingPolicy=release-signing" `
              -Headers $hdr -InFile $file -ContentType 'application/octet-stream'
            $srId = $sr.signingRequestId
            # 2) 轮询（最多 5 分钟，避免 CI 卡死）
            $st = $null
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 10
              $st = Invoke-RestMethod -Uri "$base/signing-requests/$srId" -Headers $hdr
              if ($st.status -ne 'Pending' -and $st.status -ne 'Queued') { break }
            }
            if ($st.status -ne 'Completed') { throw "signing not completed: $($st.status)" }
            # 3) 下载签名后文件覆盖原文件
            Invoke-WebRequest -Uri $st.links.signedArtifact -Headers $hdr -OutFile $file
            Write-Host "signed: $file"
          }

          # 真正需要签名的是会直接被用户执行的二进制；zip 只是容器。
          Invoke-Sign "dist/ghboost-tray.exe"
          # 若有 MSI 安装包（版本号不固定，不要写死），全部签上；没有则静默跳过。
          # MSI 走 SignPath 的 installer 行为准则，需满足可卸载/可还原（install.ps1 已满足）。
          foreach ($m in (Get-ChildItem dist -Filter *.msi -File)) {
            Invoke-Sign $m.FullName
          }
          # 签名会改变文件哈希，按签名后的内容重算校验和
          $Root = (Resolve-Path dist).Path
          (Get-ChildItem dist -Recurse -File | ForEach-Object {
            $rel = $_.FullName.Substring($Root.Length + 1)
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash, $rel
          }) | Out-File -Encoding ascii dist/SHA256SUMS.txt
          # 只有全部签名成功才会走到这里：删旧 zip、用签名后的 dist 重新打包
          Remove-Item ghboost-tray-windows-x64.zip -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path dist/* -DestinationPath ghboost-tray-windows-x64.zip
          Write-Host "SignPath code-signing step done."

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghboost-tray-windows-x64
          path: ghboost-tray-windows-x64.zip

      # 真的把 install.ps1 跑一遍 —— 这是整条流水线里唯一验证
      # 「装完之后用户在自己机器上到底拿得到什么」的一步。
      #
      # 为什么非加不可：内核档名不符那个 bug（发行包里有核心、程式却找不到）
      # 恰好就发生在这里，而在此之前没有任何一环执行过安装脚本 ——
      # CI 只验证了「zip 里有 kernel\bin\mihomo.exe」，没验证「装完之后
      # <InstallDir>\bin\mihomo.exe 存在」。中间隔着一整段 PowerShell。
      #
      # 用 Windows PowerShell 5.1（不是 pwsh）执行，跟用户实际拿到的一致；
      # -NoLaunch 让脚本装完就退出，不会在 runner 上把托盘程式挂起来。
      - name: Install smoke test (actually run install.ps1)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Tmp = Join-Path $env:TEMP "ghboost-itest"
          $InstallDir = Join-Path $env:TEMP "ghboost-installed"
          Remove-Item $Tmp, $InstallDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $Tmp | Out-Null

          Expand-Archive -Path ghboost-tray-windows-x64.zip -DestinationPath $Tmp -Force

          $Script = Join-Path $Tmp "install.ps1"
          Write-Host "Running: $Script"
          & powershell -NoProfile -ExecutionPolicy Bypass -File $Script `
              -InstallDir $InstallDir -NoShortcut -NoAutostart -NoLaunch
          if ($LASTEXITCODE -ne 0) {
            throw "install.ps1 exited with $LASTEXITCODE"
          }

          # 断言装完之后的实际布局 —— 这才是用户真正会得到的东西。
          # W7 起 xray/sing-box 也必须落位：只断言 zip 里有、不断言装完有，
          # 正是当年 mihomo 档名 bug 漏掉的那半段。
          foreach ($rel in @("ghboost-tray.exe", "bin\mihomo.exe",
                             "bin\xray.exe", "bin\sing-box.exe",
                             "bin\geoip.dat", "bin\geosite.dat",
                             "mihomo\country.mmdb", "mihomo\geosite.dat")) {
            $f = Join-Path $InstallDir $rel
            if (-not (Test-Path $f)) { throw "missing after install: $f" }
            Write-Host ("  ok  {0,-24} {1}" -f $rel, (Get-Item $f).Length)
          }
          # 许可证文本同样要断言**装完**在位。上面第 317-318 行写过为什么内核必须
          # 断到装完这一层（当年 mihomo 档名 bug 就是漏在这半段）—— 同样的道理对
          # 许可证成立，而且这里本来就有洞：THIRD-PARTY-NOTICES.md 对三个内核都写着
          # 「安装目录提供」，而 install.ps1 原本只搬 bin\* 和 mihomo\*，许可证压根
          # 没进安装目录。装完这一层不断言，就永远没人会发现。
          $LicOk = $true
          foreach ($lic in @("mihomo-LICENSE.txt", "xray-LICENSE.txt", "sing-box-LICENSE.txt")) {
            $f = Join-Path $InstallDir $lic
            if (-not (Test-Path $f)) {
              Write-Host "  MISSING after install: $lic"
              $LicOk = $false
              continue
            }
            $sz = (Get-Item $f).Length
            if ($sz -lt 10240) {
              Write-Host ("  TOO SMALL {0}: {1} bytes (pointer notice, not license text)" -f $lic, $sz)
              $LicOk = $false
              continue
            }
            Write-Host ("  ok  {0,-24} {1}" -f $lic, $sz)
          }
          if (-not $LicOk) { throw "kernel license texts missing or truncated in the installed layout" }
          Write-Host "Install smoke test passed."

      # 打 tag 时挂到 Release 上，作为对外下载地址。
      # 若仓库已配置 SIGNPATH_API_TOKEN，上面的「Code-sign」步骤已把
      # exe/msi 签名并重新打包，这里挂上去的就是带正规签名的产物；
      # 没配置则仍是未签名包（首次下载会遇到 SmartScreen 警告，见产品页 FAQ）。
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ghboost-tray-windows-x64.zip
