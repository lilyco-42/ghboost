[package]
name = "lilyco-ghboost"
version = "0.3.14"
edition = "2021"
description = "GitHub 访问加速 + 免费节点扫描/测速/注入（lilyco 框架）；核心逻辑导出 C ABI 供多语言/多平台集成"
license = "MIT"

[lib]
name = "ghboost"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "ghboost"
path = "src/main.rs"

[dependencies]
lilyco-core = { git = "https://github.com/lilyco-42/lilyco" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
base64 = "0.22"
percent-encoding = "2"
rand = "0.8"
libc = "0.2"

# ── 原生目标：完整 lilyco（TUI + Web GUI）+ 真 tokio ──
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lilyco = { git = "https://github.com/lilyco-42/lilyco" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
# Web 控制台（无参 / --web 双击即用）。为什么不用 lilyco-gui 的 GuiRenderer：
# 它的页面模板从公网 CDN 拉 layui.js（lilyco-gui/src/lib.rs:475），
# 而所有事件绑定都包在 `layui.use(...)` 回调里（477~518）——CDN 拉不到时
# layui 未定义、回调不执行，Run 按钮退化成原生表单提交，表现为"点了没反应"。
# ghboost 的受众恰恰是外网连通性差的人，本地控制台不能依赖公网资源。
# 故这里起一个极小的 axum 服务复用仓库自带的 `src/gui.html`（零外部请求）。
axum = "0.8"
# 跨平台打开默认浏览器：Windows ShellExecute / macOS open / Linux xdg-open
webbrowser = "1"
# SSE 事件流（`async_stream::stream!`）——axum 的 Sse 需要一个 Stream
async-stream = "0.3"

# ── wasm32-unknown-unknown：三处必须裁剪，否则编不过 ──
# 1) lilyco 默认 feature 含 web（= lilyco-gui → axum → hyper → tokio(full) → mio），
#    mio 在这个 target 上有 48 个 E0432/E0433。wasm 侧只保留 CLI + MCP（纯 Rust）。
#    注意：`--no-default-features` 只作用于本包，管不到 lilyco 的默认 feature，
#    所以必须在这里显式关掉。
# 2) tokio 在 wasm 上有硬编码 feature 白名单（tokio/src/lib.rs 的 compile_error!），
#    只允许 sync/macros/io-util/rt/time，rt-multi-thread 直接编译失败。
#    tokio_with_wasm 提供 alias：原生 = 真 tokio，web = 它自己的 JS glue。
# 3) getrandom 0.2 在 wasm32-unknown-unknown 要求开 js feature，否则 compile_error。
#    它是 rand 的间接依赖，靠 feature 统一在这里打开。
[target.'cfg(target_arch = "wasm32")'.dependencies]
lilyco = { git = "https://github.com/lilyco-42/lilyco", default-features = false }
tokio_with_wasm = { version = "0.10", features = ["rt", "sync", "time"] }
getrandom = { version = "0.2", features = ["js"] }

[features]
# webview 需要本机 webview-capi 原生库：
#   Windows — 仓库只带了 x86_64 **MSVC** 版的 lib/webview/webview.lib
#   Linux   — 需要 webkit2gtk-4.1 + gtk-3
#   macOS   — 无预编译库
# 默认开启会让所有没有对应原生库的目标在**链接期**失败（能编译、cargo test 也挂）。
# 故默认关闭；需要 GUI 的构建显式加 `--features webview`
# （见 .github/workflows/build-all.yml 的 Windows x86_64 MSVC job）。
default = []
webview = []

[build-dependencies]
cc = "1.0"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
