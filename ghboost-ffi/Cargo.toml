[package]
name = "ghboost-ffi"
version = "0.1.0"
edition = "2021"
description = "ghboost FFI bindings for Android (JNI) and iOS (C ABI)"
license = "MIT"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
lilyco-ghboost = { path = "..", package = "lilyco-ghboost" }
serde_json = "1.0"
jni = { version = "0.21", optional = true }
libc = "0.2"

[features]
default = ["android"]
android = ["jni"]
ios = []

[profile.release]
lto = true
opt-level = "s"
strip = true
