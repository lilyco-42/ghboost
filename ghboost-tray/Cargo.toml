[package]
name = "ghboost-tray"
version = "0.3.8"
edition = "2021"
description = "ghboost 桌面托盘版 —— 状态灯 + 傻瓜式面板 + 台湾代理设定，免命令行"
license = "MIT"

# 注意：ghboost 的 package 名是 lilyco-ghboost，但 [lib] name 是 ghboost。
# 依赖键即 extern crate 名，用 package= 指向真实包名。
[dependencies]
ghboost = { path = "..", package = "lilyco-ghboost" }
tray-icon = "0.24"
serde_json = "1"
# 跨平台开浏览器：Windows ShellExecute / macOS open / Linux xdg-open / WSL wslview
# （ghboost 内部已用它，这里只是想在"控制台已启动"时再开一次窗口）
webbrowser = "1"

# Windows 消息泵：托盘能响应点击的**硬前提**（见 src/main.rs 的 win 模块注释）。
# 版本与 tray-icon/muda 用的是同一个，避免重复编译一份。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[[bin]]
name = "ghboost-tray"
path = "src/main.rs"

# 用户下载体积里 tray.exe ≈ 6.9 MB，其中绝大部分是代码本体（Rust + tray-icon
# + serde + tokio + lilyco + windows-sys），符号表只占 ~330 KB。strip 之后
# 二进制大小几乎不变，但符号表清空：减小 zip 体积、提高逆向门槛、
# 减少调试信息泄露。值。
# 注意：用 `strip = "symbols"`（字符串值）；Windows MSVC 上 boolean 形式
# (`strip = true`) 会被静默忽略。
[profile.release]
strip = "symbols"
